name: vps-manager

services:
  vps-manager:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: vps-manager:latest
    container_name: vps-manager
    restart: unless-stopped
    network_mode: host
    pid: host
    privileged: true
    environment:
      VPS_ROOMS_ADDR: ":9090"
      VPS_MANAGER_BASE: /vps-manager
      VPS_MANAGER_DATA: /vps-manager/data
      VPS_MANAGER_SINGLE: /vps-manager/single
      VPS_MANAGER_MULTI: /vps-manager/multi
      VPS_MANAGER_PROXY: /vps-manager/proxy
      VPS_ROOMS_AGENT_SOCK: /vps-manager/data/agent.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /vps-manager/bin:/vps-manager/bin
      - /vps-manager/data:/vps-manager/data
      - /vps-manager/proxy:/vps-manager/proxy
      - /vps-manager/x5coder-agent:/vps-manager/x5coder-agent
      - /vps-manager/single:/vps-manager/single
      - /vps-manager/multi:/vps-manager/multi
      - /vps-manager/backup:/vps-manager/backup
    # Panel only — does not stop or remove other containers.
    labels:
      org.opencontainers.image.title: "VPS Manager"
      org.opencontainers.image.source: "https://github.com/X5Coder/VPS-Manager"
      org.opencontainers.image.vendor: "X5Coder"
