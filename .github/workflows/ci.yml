name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Test
        run: go test ./...
      - name: Build panel
        run: CGO_ENABLED=0 go build -ldflags="-s -w" -o /tmp/vps-rooms .
